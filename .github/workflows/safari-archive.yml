# Archives the Safari app on a released macOS runner.
#
# The developer Mac runs a macOS 27 beta, and an archive built there records
# BuildMachineOSBuild 26A5388g. App Store Connect rejects those with ITMS-90111
# ("Unsupported SDK or Xcode version") even though Xcode 26.6 and the iOS 26
# SDK are the current released versions — it is the host OS Apple objects to.
# GitHub's macos-26 image is a released build, so archives from here are clean.
#
# Nothing is signed here, so no certificates or App Store Connect keys are
# needed. Download the artifact and run safari/upload-ci-archives.sh on the
# developer Mac to export, sign and upload. Signing after compilation leaves
# the toolchain and build-machine metadata App Review reads untouched.
#
# BUILD_NUMBER must match safari/build.py, which stamps it into the project.
name: Safari App Store archives

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  BUILD_NUMBER: "6"
  PROJECT: "safari/xcode/Superteam Earn Dark/Superteam Earn Dark.xcodeproj"

jobs:
  archive:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select the App Store toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Record the build environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Archive iOS without signing
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme 'Superteam Earn Dark (iOS)' \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/EarnDark-iOS.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Archive macOS without signing
        run: |
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme 'Superteam Earn Dark (macOS)' \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/EarnDark-macOS.xcarchive" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Show the metadata App Review inspects
        run: |
          for plist in \
            "$RUNNER_TEMP/EarnDark-iOS.xcarchive/Products/Applications/Superteam Earn Dark.app/Info.plist" \
            "$RUNNER_TEMP/EarnDark-macOS.xcarchive/Products/Applications/Superteam Earn Dark.app/Contents/Info.plist"; do
            echo "== $plist"
            for key in CFBundleShortVersionString CFBundleVersion DTXcode DTXcodeBuild DTSDKName BuildMachineOSBuild; do
              printf '%s = ' "$key"
              /usr/libexec/PlistBuddy -c "Print :$key" "$plist"
            done
          done

      - name: Package archives
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/EarnDark-iOS.xcarchive" "$RUNNER_TEMP/EarnDark-iOS.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/EarnDark-macOS.xcarchive" "$RUNNER_TEMP/EarnDark-macOS.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: safari-app-store-archives
          path: |
            ${{ runner.temp }}/EarnDark-iOS.zip
            ${{ runner.temp }}/EarnDark-macOS.zip
          if-no-files-found: error
