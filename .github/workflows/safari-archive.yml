name: Safari App Store archives

on:
  workflow_dispatch:
  push:
    branches:
      - codex/safari-build-4

jobs:
  archive:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select the App Store toolchain
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app

      - name: Record the build environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Archive iOS without signing
        run: |
          xcodebuild archive \
            -project 'safari/xcode/Superteam Earn Dark/Superteam Earn Dark.xcodeproj' \
            -scheme 'Superteam Earn Dark (iOS)' \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SuperteamEarnDark-iOS-4.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Archive macOS without signing
        run: |
          xcodebuild archive \
            -project 'safari/xcode/Superteam Earn Dark/Superteam Earn Dark.xcodeproj' \
            -scheme 'Superteam Earn Dark (macOS)' \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/SuperteamEarnDark-macOS-4.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package archives
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/SuperteamEarnDark-iOS-4.xcarchive" \
            "$RUNNER_TEMP/SuperteamEarnDark-iOS-4.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/SuperteamEarnDark-macOS-4.xcarchive" \
            "$RUNNER_TEMP/SuperteamEarnDark-macOS-4.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: safari-app-store-archives-4
          path: |
            ${{ runner.temp }}/SuperteamEarnDark-iOS-4.zip
            ${{ runner.temp }}/SuperteamEarnDark-macOS-4.zip
          if-no-files-found: error
          retention-days: 1
